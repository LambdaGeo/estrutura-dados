site_name: Estruturas de Dados
site_description: >
  Livro didático da disciplina de Estrutura de Dados:
  Recursividade, TAD, Listas, Pilhas, Filas, Árvores (BST, AVL, Heaps) e Ordenação.
site_author: "Sergio Souza Costa"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Apresentação: index.md
  - "Pré-requisito: C para Programadores Python e VisuAlg": https://lambdageo.github.io/introducao-c/
  
  - Unidade 1 — Pilhas, Listas e Filas:
    - Aulas:
      - "0. Apresentação da Disciplina": aulas/00_apresentacao.md
      - "1. Pilha Estática I: Vetores Globais": aulas/01_pilha_estatica_1.md
      - "2. Pilha Estática II: Funções, Ponteiros e Structs": aulas/02_pilha_estatica_2.md
      - "3. Pilha Estática III: Alocação Dinâmica": aulas/03_pilha_estatica_3.md
      - "4. Listas Estáticas como TAD em C": aulas/04_lista_estatica.md
      - "5. Listas Encadeadas como TAD em C": aulas/05_lista_encadeada.md
      - "6. Filas como TAD em C": aulas/06_fila_tad.md
    - Exercícios:
      - "Pilhas": exercicios/u1_02_pilhas.md
      - "Exercícios com Listas":
        - "Visão Geral": exercicios/u1_03_listas_index.md
        - "Lista Estática": exercicios/u1_03_listas_estatica.md
        - "Lista Encadeada": exercicios/u1_03_listas_encadeada.md
      - "Caderno de Exercícios": exercicios/u1_04_caderno_exercicios.md

  - Unidade 2 — Árvores:
    - Aulas:
      - "7. Recursão e Algoritmos de Busca": aulas/07_recursao_busca.md
      - "8. Árvores: Conceitos e Binária": aulas/08_arvores_conceitos.md
      - "9. Árvores Binárias de Busca": aulas/09_arvores_busca.md
      - "10. Árvores AVL: Conceito": aulas/10_arvores_avl_conceito.md
      - "11. Árvores AVL: Implementação": aulas/11_arvores_avl_implementacao.md
    - Exercícios:
      - "Recursividade": exercicios/u2_01_recursividade.md
      - "Árvores Binárias (Estruturais)": exercicios/u2_02_arvores_binarias.md
      - "Árvores Binárias de Busca (ABB)": exercicios/u2_03_arvores_busca.md
      - "Árvores AVL": exercicios/u2_04_arvores_avl.md

  - Unidade 3 — Ordenação:
    - Aulas:
      - "12. Complexidade & Profiling (gcov/gprof)": aulas/12_analise_complexidade.md
      - "13. Algoritmos de Ordenação Básicos": aulas/13_ordenacao_basica.md
      - "14. Algoritmos de Ordenação Avançados": aulas/14_ordenacao_avancada.md

  - Laboratórios:
    - "Laboratório: REPL Baseado em Pilha": laboratorios/01_repl_pilha.md
    - "Trabalho Prático: Algoritmos de Ordenação": laboratorios/02_trabalho_pratico.md


